/* Categories list */
const categories = ["General World Model","Multi-Agent World Model","Benchmark","Dataset","Long Video Generation","Static Memory","Dynamic Memory","Action Control","Interactive","Post-Training","Physics","Evaluation","Survey","Others"];

/* State */
let activeTag = "all";
let activeCategory = "all";
let searchQuery = "";
let activeLang = "zh";
let activeMonth = "all";

/* Init */
function init() {
  const select = document.getElementById("categorySelect");
  categories.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c; opt.textContent = c;
    select.appendChild(opt);
  });
  select.addEventListener("change", e => { activeCategory = e.target.value; render(); });
  document.getElementById("searchInput").addEventListener("input", e => { searchQuery = e.target.value.toLowerCase(); render(); });
  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      activeTag = btn.dataset.tag;
      document.querySelectorAll(".filter-btn").forEach(b => {
        b.classList.remove("active","active-star","active-open","active-closed");
      });
      if (activeTag === "all") btn.classList.add("active");
      else if (activeTag === "star") btn.classList.add("active-star");
      else if (activeTag === "opensource") btn.classList.add("active-open");
      else if (activeTag === "closed") btn.classList.add("active-closed");
      render();
    });
  });
  document.getElementById("langToggle").addEventListener("click", e => {
    const span = e.target.closest("span[data-lang]");
    if (!span) return;
    activeLang = span.dataset.lang;
    document.querySelectorAll("#langToggle span").forEach(s => s.classList.remove("active"));
    span.classList.add("active");
    render();
  });
  window.addEventListener("scroll", updateMonthProgress, {passive: true});
  window.addEventListener("resize", updateMonthProgress);
  render();
}

/* Parse arxiv ID to numeric for sorting */
function arxivNumeric(id) {
  if (!id) return -1;
  const clean = id.replace(/v\d+$/, "");
  const parts = clean.split(".");
  if (parts.length === 2) return parseFloat(parts[0]) * 100000 + parseFloat(parts[1]);
  return parseFloat(clean);
}

function dateNumeric(date) {
  const match = date && date.match(/^20(\d{2})-(\d{2})-(\d{2})/);
  if (!match) return -1;
  return parseFloat(`${match[1]}${match[2]}`) * 100000 + parseFloat(match[3]);
}

function paperNumeric(p) {
  const fromArxiv = arxivNumeric(p.arxivId);
  if (fromArxiv !== -1) return fromArxiv;
  return dateNumeric(p.date);
}

/* Derive month labels from arXiv ids, with optional manual dates for non-arXiv papers. */
function paperMonth(p) {
  if (p.date) return p.date.slice(0, 7);
  if (!p.arxivId) return null;
  const clean = p.arxivId.replace(/v\d+$/, "");
  const match = clean.match(/^(\d{2})(\d{2})\./);
  if (!match) return null;
  const month = Number(match[2]);
  if (month < 1 || month > 12) return null;
  return `20${match[1]}-${match[2]}`;
}

function matchesFilters(p, includeMonth = true) {
  if (activeTag !== "all" && !p.tags.includes(activeTag)) return false;
  if (activeCategory !== "all" && !p.categories.includes(activeCategory)) return false;
  if (searchQuery && !p.title.toLowerCase().includes(searchQuery)) return false;
  if (includeMonth && activeMonth !== "all" && paperMonth(p) !== activeMonth) return false;
  return true;
}

function paperDateLabel(p) {
  if (p.date) return p.date;
  return paperMonth(p);
}

function categoryClass(category) {
  return `cat-${category.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "")}`;
}

function getAvailableMonths() {
  const counts = new Map();
  papers.filter(p => matchesFilters(p, false)).forEach(p => {
    const month = paperMonth(p);
    if (!month) return;
    counts.set(month, (counts.get(month) || 0) + 1);
  });
  return [...counts.entries()].sort((a, b) => b[0].localeCompare(a[0]));
}

function ensureActiveMonth() {
  if (activeMonth === "all") return;
  const hasMonth = getAvailableMonths().some(([month]) => month === activeMonth);
  if (!hasMonth) activeMonth = "all";
}

/* Filter and sort papers */
function getFiltered() {
  let result = papers.filter(p => matchesFilters(p));
  result.sort((a, b) => {
    if (activeCategory !== "all") {
      const aStar = a.tags.includes("star") ? 1 : 0;
      const bStar = b.tags.includes("star") ? 1 : 0;
      if (aStar !== bStar) return bStar - aStar;
    }
    const na = paperNumeric(a), nb = paperNumeric(b);
    if (na === -1 && nb === -1) return 0;
    if (na === -1) return 1;
    if (nb === -1) return -1;
    return nb - na;
  });
  return result;
}

function renderMonthRail() {
  const rail = document.getElementById("monthRail");
  if (!rail) return;
  const months = getAvailableMonths();
  const allCount = papers.filter(p => matchesFilters(p, false)).length;
  rail.innerHTML = `
    <div class="month-progress" aria-hidden="true"><span class="month-progress-fill" id="monthProgressFill"></span></div>
    <div class="month-title">Month</div>
    <button class="month-btn ${activeMonth === "all" ? "active" : ""}" data-month="all" type="button">All <span class="month-count">${allCount}</span></button>
    ${months.map(([month, count]) => `<button class="month-btn ${activeMonth === month ? "active" : ""}" data-month="${month}" type="button">${month} <span class="month-count">${count}</span></button>`).join("")}
  `;
  rail.querySelectorAll(".month-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const nextMonth = btn.dataset.month;
      activeMonth = nextMonth === activeMonth ? "all" : nextMonth;
      window.scrollTo({top: 0, behavior: "smooth"});
      render();
    });
  });
}

function updateMonthProgress() {
  const fill = document.getElementById("monthProgressFill");
  if (!fill) return;
  const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
  const progress = maxScroll > 0 ? Math.min(1, Math.max(0, window.scrollY / maxScroll)) : 0;
  fill.style.height = `${progress * 100}%`;
}

/* Render papers */
function render() {
  ensureActiveMonth();
  const list = document.getElementById("paperList");
  const filtered = getFiltered();
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><p>No papers found</p></div>';
  } else {
    list.innerHTML = filtered.map(p => {
      const isStarred = p.tags.includes("star");
      const badges = p.tags.map(t => {
        if (t === "star") return '<span class="badge badge-star">🌟 Classic</span>';
        if (t === "opensource") return '<span class="badge badge-open">✅ Open Source</span>';
        if (t === "closed") return '<span class="badge badge-closed">❌ Closed</span>';
        return "";
      }).join("");
      const descText = activeLang === "en" && p.descriptionEn ? p.descriptionEn : p.description;
      const desc = descText ? `<div class="paper-desc">${descText}</div>` : "";
      const aid = p.arxivId ? `<span class="paper-arxiv">arXiv: ${p.arxivId}</span>` : "";
      const date = paperDateLabel(p);
      const dateMeta = date ? `<span class="paper-date">${date}</span>` : "";
      return `<div class="paper-card ${isStarred ? "starred" : ""}">
        <div class="paper-header">
          <div class="paper-main">
            <div class="paper-badges">${badges}</div>
            <a class="paper-title" href="${p.url}" target="_blank" rel="noopener">${p.title}</a>
          </div>
          ${dateMeta}
        </div>
        <div class="paper-meta">
          ${p.categories.map(c => `<span class="paper-category ${categoryClass(c)}" onclick="filterByCategory('${c}')">${c}</span>`).join("")}${aid}
        </div>
        ${desc}
      </div>`;
    }).join("");
  }
  const monthStatus = activeMonth === "all" ? "" : ` · Month ${activeMonth}`;
  document.getElementById("statusBar").textContent = `Showing ${filtered.length} of ${papers.length} papers${monthStatus}`;
  renderMonthRail();
  updateMonthProgress();
}

function filterByCategory(cat) {
  activeCategory = cat;
  document.getElementById("categorySelect").value = cat;
  render();
}

document.addEventListener("DOMContentLoaded", init);
</script>
